<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: beige;
        }

        /* Target ONLY the div with the class "responsive-text" */

        .responsive-text::after {
            content: "This is for bigger screen";
        }
        
        .responsive-text {
            text-align: center;
            font-size: xx-large;
        }

        @media (max-width: 600px) {
            body {
                background-color: yellow;
            }
            .responsive-text::after {
                content: "This is for smaller screen";
            }
        }

        @media (min-width: 601px) and (max-width: 1000px) {
            body {
                background-color: aqua;
            }

            .responsive-text::after {
                content: "This is for medium size screen";
            }
        }

        @media (min-width: 1001px) and (max-width: 1400px) {
            body {
                background-color: green;
            }

            .responsive-text::after {
                content: "This is for bit larger screen";
            }
        }

        @media (min-width: 2000px) {
            body {
                background-color: blueviolet;
            }

            .responsive-text::after {
                content: "This is for TV screen";
            }
        }
    </style>

</head>
<body>
    <!-- Added the class here to prevent other divs from copying it -->
    <div class="responsive-text"></div>
</body>
</html>
