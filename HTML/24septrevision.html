<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .header {
            background-color: aqua;
        }

        input {
            display: none;
        }

        label {
            border: 1px solid #000000;
            align-items: center;
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
        }

        .buttons {
            gap: 30px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        label:hover {
            cursor: pointer;
        }

        .buttons input:checked+label {
            background-color: blueviolet;
            color: aqua;
        }

        .content {
            width: 100%;
        }

        .content>div {
            display: none;
        }

        #home:checked~.content .home {
            display: block;
        }
        
    </style>
</head>

<body>
    <div class="header">
        <div class="buttons">
            <input type="radio" name="a" id="home" checked>
            <label for="home">Home</label>

            <input type="radio" name="a" id="recycle">
            <label for="recycle">Recycle</label>

            <input type="radio" name="a" id="date-&-time">
            <label for="date-&-time">Date & Time</label>

            <input type="radio" name="a" id="events">
            <label for="events">Events</label>
        </div>
        <div class="content">
            
            <div class="home">
                <h1>The Home Page</h1>
            </div>
            <div class="recycle">
                <h1>Recycle center</h1>
            </div>
            <div class="date-&-time">
                <h1>Time & Table</h1>
            </div>
            <div class="events">
                <h1>Events</h1>
            </div>
        </div>
    </div>
</body>

</html>
