<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS CODE HTML</title>
    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        }

        header,
        .left-header-logo,
        .left-header-navigation{
            display: flex;
            align-items: center;
        }

        header {
            background-color: #0d1014;
            color: white;
            height: 70px;
            justify-content: space-between;
        }

        .left-header-logo{
            margin-left: 20px;
            display: flex;
            gap: 7px;
        }

        .left-header-navigation a{
            text-decoration: none;
            color: white;
            margin: 10px;
        }

        .right-header {
            margin-right: 25px;
        }
        .header-button{
            background-color: #1b65dc;
            color: white;
            border: #1b65dc;
            padding: 5px;
            size: 22px;
        }
    </style>
</head>

<body> 
    <header>
        <section class="left-header-logo">
            <img src="vscode.png" alt="" height="20px">
            <section class="left-header-text">
            <p>Visual Studio Code</p>
            </section>
            <nav class="left-header-navigation">
                <a href="">Features</a>
                <a href="">Docs</a>
                <a href="">Release Notes</a>
                <a href="">Blog</a>
                <a href="">Learn</a>
                <a href="">Events</a>
                <a href="">Resources</a>
            </nav>
        </section>
        <section class="right-header">
            <input type="text" placeholder="Search..."/>
            <button class="header-button" style="font-style: 20px;">Download</button>
        </section>
    </header>
</body>

</html>
