<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        background-color: red;
        height: 100px;
        width: 100px;
        position: relative;
        animation-name: colorchange;
        animation-duration: 10s;
        animation-delay: 1s;
        animation-iteration-count: infinite;
        animation-direction: reverse;
        animation-fill-mode: backwards;
      }

      #ease {
        animation-timing-function: ease;
      }
      #linear {
        animation-timing-function: linear;
      }
      #ease-in {
        animation-timing-function: ease-in;
      }
      #ease-in-out {
        animation-timing-function: ease-in-out;
      }

      @keyframes colorchange {
        0% {
          background-color: blue;
          top: 0px;
          left: 0px;
        }
        25% {
          background-color: palevioletred;
          top: 0px;
          left: 200px;
        }

        50% {
          background-color: yellowgreen;
          top: 200px;
          left: 200px;
        }

        75% {
          background-color: aquamarine;
          top: 200px;
          right: 0px;
        }
        100% {
          background-color: brown;
          top: 0px;
          left: 0px;
        }
      }
    </style>
  </head>
  <body>
    <div id="linear">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlanf4PmGvC2fFDfGpfz6KbbcSAcef2DZh3fVnRBC65A&s=10" alt="" height="100px" width="100px">
    </div>
    <div id="ease">Ease</div>
    <div id="ease-in">Ease-in</div>
    <div id="ease-in-out">Ease-in-out</div>
  </body>
</html>
