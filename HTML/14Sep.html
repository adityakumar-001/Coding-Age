<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Head</title>
</head>
<body>
    <table border="2">
        <thead><tr><th colspan="8"> Time & Table</th></tr>
        </thead>
        <tr>
            <th>1 <br>Date</th>
            <th>2 <br>Shift</th>
            <th>4 <br>Class</th>
            <th>5 <br>Class</th>
            <th>Lunch</th>
            <th>5 <br>Class</th>
            <th>6 <br>Class</th>
            <th>7 <br>Class</th>
            <th>8 <br>Class</th>
        </tr>
        <tbody>
            <tr>
                <td><br>Monday</td>
                <td><br>Tuesday</td>
                <td><br>Thursday</td>
                <td><br>Friday</td>
                <td><br>Saturday</td>
                <td><br>Sunday</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
