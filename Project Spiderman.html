<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        background-color: red;
        height: 300px;
        width: 00px;
        position: relative;
        animation-name: colorchange;
        animation-duration: 10s;
        animation-delay: 1s;
        animation-iteration-count: infinite;
        animation-direction: reverse;
        animation-fill-mode: backwards;
      }

      #ease {
        animation-timing-function: ease;
      }
      #linear {
        animation-timing-function: linear;
      }
      #ease-in {
        animation-timing-function: ease-in;
      }
      #ease-in-out {
        animation-timing-function: ease-in-out;
      }

      @keyframes colorchange {
        0% {
          background-color: blue;
          top: 0px;
          left: 0px;
        }
        25% {
          background-color: palevioletred;
          top: 500px;
          left: 600px;
        }

        50% {
          background-color: yellowgreen;
          top: 500px;
          left: 600px;
        }

        75% {
          background-color: aquamarine;
          top: 500px;
          right: 900px;
        }
        100% {
          background-color: brown;
          top: 0px;
          left: 0px;
        }
      }
    </style>
  </head>
  <body>
    <div id="linear"> <img src="Logo-removebg-preview.png" alt="" height="300px" width="300px"></div><br>
    <div id="ease">
      <img src="ChatGPT Image Sep 11, 2026, 02_17_03 PM.png" alt="" height="300px" width="300px"></div><br>
    <div id="ease-in">
      <img src="Anh-removebg-preview.png" alt="" height="300px" width="300px"></div><br>
    <div id="ease-in-out">
      <img src="Shivansh.png" alt="" height="600px" width="300px"></div><br>
  </body>
</html>
